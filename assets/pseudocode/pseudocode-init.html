<script>
// Quarto book chapters render at varying nesting depth (index.html at the
// root, chapters/*.html one level down), and a plain <script src="assets/...">
// only resolves correctly from the root -- Quarto path-adjusts its own
// dependencies (site_libs, css:) for this, but not raw include-in-header
// HTML. `quarto:offset` is the same root-relative offset Quarto's own
// quarto-search.js reads at runtime, so reuse it here instead of hardcoding
// a path that would 404 on nested chapter pages.
(function () {
  var offsetMeta = document.querySelector('meta[name="quarto:offset"]');
  var offset = offsetMeta ? offsetMeta.content : "./";

  // pseudocode.js's Renderer constructor reads `MathJax.version` (to pick its
  // MathJax-vs-KaTeX code path) with no guard for MathJax existing-but-not-
  // finished-initializing. MathJax's own <script> is `defer`, so by
  // `DOMContentLoaded` its top-level code has run and `window.MathJax` exists,
  // but `MathJax.version` is only attached once MathJax's own async startup
  // completes. On a slow connection this can still be pending at
  // DOMContentLoaded, so pseudocode.renderClass() throws `Cannot read
  // properties of undefined (reading 'split')` on the very first
  // <pre class="pseudocode"> it processes -- and since it renders all of them
  // in one uncaught forEach, that one throw leaves *every* block as raw,
  // unrendered LaTeX text (reproduced via Chrome DevTools Protocol network
  // throttling; see the M1 follow-up commit for the repro).
  //
  // `MathJax.startup.promise` is MathJax's own "fully ready" signal, so
  // waiting for it before the first renderClass() call fixes the crash. But
  // that promise doesn't resolve until MathJax's *entire* startup finishes,
  // including its optional accessibility (speech-rule-engine) bundle, which
  // is several additional sequential CDN fetches -- on a slow connection this
  // can take much longer than a reasonable render delay, or even effectively
  // hang. So this races that promise against a hard timeout: prefer proper
  // MathJax readiness when the network allows it (the common case), but
  // never block pseudocode rendering on it indefinitely.
  var mathJaxReady = new Promise(function (resolve) {
    var settled = false;
    var settle = function () {
      if (!settled) {
        settled = true;
        resolve();
      }
    };
    var pollForStartupPromise = function (attemptsLeft) {
      if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
        MathJax.startup.promise.then(settle);
      } else if (attemptsLeft > 0) {
        setTimeout(function () { pollForStartupPromise(attemptsLeft - 1); }, 100);
      } else {
        settle();
      }
    };
    pollForStartupPromise(50);
    setTimeout(settle, 8000); // hard cap regardless of the above
  });

  var loadPseudocode = function (onLoaded) {
    var script = document.createElement("script");
    script.src = offset + "assets/pseudocode/pseudocode.js";
    script.onload = onLoaded;
    script.onerror = function () {
      console.error("pseudocode-init: failed to load " + script.src);
    };
    document.head.appendChild(script);
  };

  // pseudocode.js renders each `$...$` math span by calling the *synchronous*
  // `MathJax.tex2chtml()` in one uncaught forEach over every
  // `<pre class="pseudocode">` on the page (see the vendored
  // assets/pseudocode/pseudocode.js, the "math" case in its Renderer). That
  // synchronous call throws ("MathJax retry -- an asynchronous action is
  // required; try using one of the promise-based functions and await its
  // resolution") whenever it needs to lazy-load font/macro data it hasn't
  // loaded yet -- and since one throw aborts the whole forEach, every block
  // *after* the first one needing new font data is left unrendered. This
  // didn't surface on L01/L03 (fewer, simpler math spans already covered by
  // whatever the page's own prose had already warmed up) but does on L05,
  // whose 9 pseudocode blocks are dense with $dp[i][j]$-style bracket/
  // subscript math not used elsewhere on the page. Fix: warm up every
  // distinct `$...$` span via the *promise*-based `tex2chtmlPromise` (which
  // can await the async font load properly) before pseudocode.js's own
  // synchronous pass runs, so that pass hits no cache miss and never throws.
  // Each individual tex2chtmlPromise call is also raced against a timeout:
  // L08's 12 pseudocode blocks (far denser than L05's 9) showed this can
  // otherwise hang outright on some inputs rather than reject -- and since
  // Promise.all never settles until every one of its promises does, a
  // single hung warm-up call silently blocked render() from *ever* running
  // (0 of 12 blocks rendered, no console error, because the render() call
  // that would throw one never happened). A per-call timeout guarantees
  // Promise.all always settles; the outer call site below adds a second,
  // whole-warm-up timeout as defense in depth.
  var withTimeout = function (promise, ms) {
    return new Promise(function (resolve) {
      var done = false;
      var finish = function (v) { if (!done) { done = true; resolve(v); } };
      promise.then(finish, finish);
      setTimeout(finish, ms);
    });
  };

  var warmUpMathJaxFonts = function () {
    if (!(window.MathJax && MathJax.tex2chtmlPromise)) return Promise.resolve();
    var mathSpans = new Set();
    document.querySelectorAll("pre.pseudocode").forEach(function (pre) {
      var re = /\$([^$]*)\$/g;
      var m;
      while ((m = re.exec(pre.textContent)) !== null) {
        if (m[1]) mathSpans.add(m[1]);
      }
    });
    return Promise.all(
      Array.from(mathSpans).map(function (tex) {
        return withTimeout(MathJax.tex2chtmlPromise(tex, { display: false }).catch(function () {}), 8000);
      })
    );
  };

  var render = function () {
    // Render each block through its own try/catch instead of
    // pseudocode.renderClass()'s single uncaught forEach over every block:
    // renderClass aborts the *entire* batch on the first parse error (a
    // malformed source construct, e.g. the \text{}/\Statex cases already
    // fixed in convert_pseudocode.py -- or, empirically, a warm-up call
    // that hasn't finished loading a glyph's font data on a slow/loaded
    // machine even with the generous timeouts above), which silently
    // leaves every block *after* the offending one unrendered too. Calling
    // pseudocode.renderElement() per-block (the same function renderClass
    // delegates to internally, per the vendored source) contains a failure
    // to just that one block.
    Array.from(document.getElementsByClassName("pseudocode")).forEach(function (el) {
      try {
        pseudocode.renderElement(el, { lineNumber: true, noEnd: false });
      } catch (e) {
        console.error("pseudocode-init: renderElement failed for one block", e);
      }
    });
    // A second typeset pass: MathJax's own initial page-scan runs before this
    // point, i.e. before pseudocode.js has swapped the <pre> placeholders for
    // real math-bearing markup, so glyphs that appear *only* inside
    // pseudocode blocks (observed: \gets) never get their per-glyph CSS
    // generated by that first scan and render as invisible empty boxes.
    if (window.MathJax && MathJax.typesetPromise) {
      MathJax.typesetPromise();
    }
  };

  var start = function () {
    loadPseudocode(function () {
      mathJaxReady
        .then(function () { return withTimeout(warmUpMathJaxFonts(), 15000); })
        .then(render);
    });
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>
