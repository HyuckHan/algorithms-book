# DRAFT — 로컬에서 quarto render로 검증 후 확정할 것 (SPEC 5장)
project:
  type: book
  output-dir: _book
  # pseudocode.js is only referenced dynamically (assets/pseudocode/pseudocode-init.html
  # builds its <script src> at runtime from `quarto:offset`), so Quarto's static
  # asset scan never sees a reference to it -- list it explicitly so it gets
  # copied into _book/.
  resources:
    - assets/pseudocode/pseudocode.js
book:
  title: "알고리즘 · Algorithms"
  author: "Hyuck Han"
  search: true
  page-navigation: true
  repo-url: https://github.com/HyuckHan/algorithms-book
  chapters:
    - index.qmd
    - chapters/01-introduction.qmd
    - chapters/02-recursion.qmd
    - chapters/03-sorting.qmd
    - chapters/04-selection.qmd
    - chapters/05-dynamic-programming.qmd
    - chapters/06-search-trees.qmd
    - chapters/07-hash-tables.qmd
    - chapters/08-graphs.qmd
    - chapters/09-string-matching.qmd
format:
  html:
    theme: [cosmo, assets/theme.scss]
    # assets/theme.scss sets $code-block-bg to a dark navy; the default
    # highlight-style is tuned for a light background, so most tokens
    # (comments, strings, most identifiers) were low-contrast-to-invisible
    # against it -- only numbers/keywords happened to still show up.
    highlight-style: github-dark
    toc: true
    code-copy: true
    include-in-header:
      - assets/mathjax-macros.html
      - assets/pseudocode/pseudocode-init.html
    css: assets/pseudocode/pseudocode.css
lang: ko
